name: Check legacy documentation links
on:
  pull_request:
    paths:
      - 'data/lidar-slam-legacy-routes.json'
      - 'scripts/build_legacy_lidar_redirects.py'
      - 'tests/test_legacy_lidar_redirects.py'
      - '.github/workflows/check-legacy-links.yml'
      - '.github/workflows/gh-pages.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_legacy_lidar_redirects.py
